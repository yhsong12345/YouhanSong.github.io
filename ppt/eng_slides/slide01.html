<style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #f3f4f6;
        }
        .slide-container {
            width: 1280px;
            height: 720px;
            position: relative;
            overflow: hidden;
            background-color: #0f172a; /* Dark Navy Background */
            color: white;
            display: flex;
            flex-direction: column;
            font-size: 14px; /* Base font size for better scaling */
        }
        .bg-pattern {
            position: absolute;
            top: 0;
            right: 0;
            width: 65%;
            height: 100%;
            background-image: url("https://page.gensparksite.com/slides_images/2ade8d0d9147df5250666843cb12f339.webp");
            background-size: cover;
            background-position: center;
            opacity: 0.15;
            mask-image: linear-gradient(to right, transparent, black);
            -webkit-mask-image: linear-gradient(to right, transparent, black);
        }
        .accent-line {
            width: 80px;
            height: 6px;
            background-color: #38bdf8; /* Light Blue */
            margin-bottom: 2rem;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
        }

        /* Print styles for PDF export */
        @media print {
            @page {
                size: 1280px 720px;
                margin: 0;
            }
            body {
                margin: 0;
                padding: 0;
                background-color: #0f172a;
            }
            .slide-container {
                width: 1280px;
                height: 720px;
                page-break-after: always;
                page-break-inside: avoid;
                margin: 0;
                padding: 0;
                position: relative;
                overflow: visible;
            }
            .slide-container:last-child {
                page-break-after: auto;
            }
            /* Ensure backgrounds print */
            * {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
                color-adjust: exact !important;
            }
            /* Hide any elements that shouldn't print */
            .no-print {
                display: none !important;
            }
        }
    </style>
