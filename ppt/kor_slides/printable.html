<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>AI & Robotics Portfolio - Print Version</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;800;900&family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        margin: 0;
        padding: 20px;
        font-family: 'Noto Sans KR', sans-serif;
        background-color: #1e293b;
    }

    /* Controls Panel */
    .controls {
        position: fixed;
        top: 20px;
        right: 20px;
        z-index: 10000;
        background: rgba(15, 23, 42, 0.98);
        padding: 20px;
        border-radius: 12px;
        border: 1px solid rgba(34, 211, 238, 0.3);
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        max-height: 90vh;
        overflow-y: auto;
        width: 300px;
    }

    .controls h3 {
        color: #22d3ee;
        font-size: 14px;
        margin-bottom: 12px;
        font-weight: 700;
    }

    .controls button {
        display: block;
        width: 100%;
        padding: 10px 16px;
        margin-bottom: 8px;
        background: linear-gradient(135deg, #06b6d4, #3b82f6);
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 13px;
        font-weight: 600;
        transition: all 0.2s;
    }

    .controls button:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 20px rgba(6, 182, 212, 0.4);
    }

    .controls button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        transform: none;
    }

    .controls button.secondary {
        background: rgba(100, 116, 139, 0.5);
    }

    .slide-selector {
        margin: 16px 0;
        padding: 12px;
        background: rgba(30, 41, 59, 0.8);
        border-radius: 8px;
        border: 1px solid rgba(148, 163, 184, 0.2);
    }

    .slide-selector h4 {
        color: #e2e8f0;
        font-size: 12px;
        margin-bottom: 10px;
        font-weight: 600;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .slide-selector .select-actions {
        display: flex;
        gap: 8px;
    }

    .slide-selector .select-actions button {
        padding: 4px 8px;
        font-size: 10px;
        margin: 0;
        width: auto;
        background: rgba(100, 116, 139, 0.5);
    }

    .slide-list {
        max-height: 350px;
        overflow-y: auto;
    }

    .slide-item {
        display: flex;
        align-items: center;
        padding: 6px 8px;
        margin-bottom: 4px;
        background: rgba(15, 23, 42, 0.5);
        border-radius: 6px;
        cursor: grab;
        transition: background 0.2s, transform 0.2s, box-shadow 0.2s;
        user-select: none;
    }

    .slide-item:hover {
        background: rgba(34, 211, 238, 0.1);
    }

    .slide-item.dragging {
        opacity: 0.5;
        background: rgba(34, 211, 238, 0.2);
    }

    .slide-item.drag-over {
        border-top: 2px solid #22d3ee;
        margin-top: -2px;
    }

    .slide-item .drag-handle {
        color: #64748b;
        margin-right: 8px;
        cursor: grab;
        font-size: 10px;
    }

    .slide-item .drag-handle:hover {
        color: #22d3ee;
    }

    .slide-item input[type="checkbox"] {
        width: 16px;
        height: 16px;
        margin-right: 10px;
        accent-color: #22d3ee;
    }

    .slide-item label {
        color: #cbd5e1;
        font-size: 11px;
        cursor: pointer;
        flex: 1;
    }

    .slide-item .slide-number {
        color: #64748b;
        font-size: 10px;
        margin-right: 8px;
        min-width: 20px;
    }

    .order-controls {
        display: flex;
        gap: 4px;
        margin-left: 8px;
    }

    .order-controls button {
        width: 20px;
        height: 20px;
        padding: 0;
        margin: 0;
        font-size: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(100, 116, 139, 0.3);
        border: 1px solid rgba(148, 163, 184, 0.3);
    }

    .order-controls button:hover {
        background: rgba(34, 211, 238, 0.3);
        transform: none;
        box-shadow: none;
    }

    .progress-bar {
        width: 100%;
        height: 6px;
        background: rgba(148, 163, 184, 0.2);
        border-radius: 3px;
        margin-top: 12px;
        overflow: hidden;
        display: none;
    }

    .progress-bar.active {
        display: block;
    }

    .progress-bar-fill {
        height: 100%;
        background: linear-gradient(90deg, #06b6d4, #3b82f6);
        border-radius: 3px;
        transition: width 0.3s;
        width: 0%;
    }

    .progress-text {
        color: #94a3b8;
        font-size: 11px;
        margin-top: 8px;
        text-align: center;
        display: none;
    }

    .progress-text.active {
        display: block;
    }

    /* Slide Wrapper - uses iframe like presentation.html */
    .slide-wrapper {
        width: 1280px;
        height: 720px;
        margin: 0 auto 30px auto;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        border-radius: 8px;
        overflow: hidden;
        position: relative;
    }

    .slide-wrapper.selected {
        box-shadow: 0 0 0 3px #22d3ee, 0 10px 40px rgba(0, 0, 0, 0.5);
    }

    .slide-wrapper.excluded {
        opacity: 0.4;
    }

    .slide-wrapper iframe {
        width: 1280px;
        height: 720px;
        border: none;
        background: #0f172a;
    }

    .loading-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(15, 23, 42, 0.95);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
    }

    .loading-overlay .spinner {
        width: 40px;
        height: 40px;
        border: 3px solid rgba(34, 211, 238, 0.2);
        border-top-color: #22d3ee;
        border-radius: 50%;
        animation: spin 1s linear infinite;
    }

    .loading-overlay p {
        color: white;
        margin-top: 16px;
        font-size: 14px;
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }

    /* Print styles - hide controls */
    @media print {
        .controls, .loading-overlay {
            display: none !important;
        }
        body {
            background: white !important;
            padding: 0 !important;
        }
        .slide-wrapper {
            page-break-after: always;
            margin: 0;
            box-shadow: none;
            border-radius: 0;
        }
        .slide-wrapper:last-child {
            page-break-after: auto;
        }
    }
</style>
</head>
<body>
    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
        <p id="loadingText">Loading slides...</p>
    </div>

    <!-- Controls Panel -->
    <div class="controls">
        <h3><i class="fa-solid fa-file-pdf" style="margin-right: 8px;"></i>Export to PDF</h3>

        <!-- Slide Selector -->
        <div class="slide-selector">
            <h4>
                Select & Reorder Slides
                <div class="select-actions">
                    <button onclick="selectAllSlides()">All</button>
                    <button onclick="selectNoSlides()">None</button>
                    <button onclick="resetOrder()">Reset</button>
                </div>
            </h4>
            <p style="font-size: 9px; color: #64748b; margin-bottom: 8px;">Drag to reorder or use arrows</p>
            <div class="slide-list" id="slideList">
                <!-- Populated by JavaScript -->
            </div>
        </div>

        <button onclick="exportToPDF()" id="exportBtn">
            <i class="fa-solid fa-download" style="margin-right: 6px;"></i>Export Selected to PDF
        </button>

        <div class="progress-bar" id="progressBar">
            <div class="progress-bar-fill" id="progressFill"></div>
        </div>
        <div class="progress-text" id="progressText">Processing...</div>

        <button onclick="window.location.href='presentation.html'" class="secondary">
            <i class="fa-solid fa-arrow-left" style="margin-right: 6px;"></i>Back to Presentation
        </button>
    </div>

    <!-- Slides Container -->
    <div id="slidesContainer"></div>

    <script>
        // Slide configuration (same order as presentation.html)
        const slides = [
            { file: 'slide01.html', title: 'Title - AI & Robotics Researcher' },
            { file: 'slide02.html', title: 'Researcher Profile' },
            { file: 'slide03.html', title: 'Education & Career Timeline' },
            { file: 'slide04.html', title: 'Core Competencies & Skills' },
            { file: 'slide14.html', title: 'Universal VLA Model' },
            { file: 'slide18.html', title: 'Smart Monitoring System' },
            { file: 'slide15.html', title: 'EASIS: Embodiment-Agnostic Swarm Intelligence System' },
            { file: 'slide05.html', title: 'Korean LLM Development' },
            { file: 'slide06.html', title: 'SEEU Track - Vehicle Detection' },
            { file: 'slide07.html', title: 'Face Recognition System' },
            { file: 'slide08.html', title: 'SEEU ID - ID Card OCR' },
            { file: 'slide09.html', title: 'Tanzania Smart Gate' },
            { file: 'slide10.html', title: 'Gumi Metaverse - Safety Detection' },
            { file: 'slide11.html', title: 'AVA Project - Autonomous Driving' },
            { file: 'slide12.html', title: 'Robotic Arm Object Relocator' },
            { file: 'slide13.html', title: 'Nvidia Jetson AMR' },
            { file: 'slide19.html', title: 'Traffic Sign Detection - Overview' },
            { file: 'slide20.html', title: 'Traffic Sign Detection - YOLOv7 Architecture' },
            { file: 'slide21.html', title: 'Traffic Sign Detection - Results' },
            { file: 'slide16.html', title: 'Key Achievements Summary' },
            { file: 'slide17.html', title: 'Thank You' },
        ];

        // Track selected slides (all selected by default)
        let selectedSlides = new Set(slides.map((_, i) => i));
        // Track slide order for export (array of original indices)
        let slideOrder = slides.map((_, i) => i);
        // Store original order for reset
        const originalOrder = slides.map((_, i) => i);
        let loadedIframes = 0;

        const container = document.getElementById('slidesContainer');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const loadingText = document.getElementById('loadingText');

        // Build slide selector UI with drag and drop
        function buildSlideSelector() {
            const slideList = document.getElementById('slideList');
            slideList.innerHTML = slideOrder.map((originalIndex, orderIndex) => `
                <div class="slide-item"
                     draggable="true"
                     data-order-index="${orderIndex}"
                     data-original-index="${originalIndex}"
                     ondragstart="handleDragStart(event)"
                     ondragover="handleDragOver(event)"
                     ondrop="handleDrop(event)"
                     ondragend="handleDragEnd(event)"
                     ondragleave="handleDragLeave(event)">
                    <span class="drag-handle"><i class="fa-solid fa-grip-vertical"></i></span>
                    <input type="checkbox" id="slide-check-${originalIndex}"
                           ${selectedSlides.has(originalIndex) ? 'checked' : ''}
                           onchange="toggleSlide(${originalIndex})"
                           onclick="event.stopPropagation()">
                    <span class="slide-number">${orderIndex + 1}</span>
                    <label for="slide-check-${originalIndex}" onclick="event.stopPropagation()">${slides[originalIndex].title}</label>
                    <div class="order-controls">
                        <button onclick="moveSlideUp(${orderIndex}); event.stopPropagation();" ${orderIndex === 0 ? 'disabled' : ''}>
                            <i class="fa-solid fa-chevron-up"></i>
                        </button>
                        <button onclick="moveSlideDown(${orderIndex}); event.stopPropagation();" ${orderIndex === slideOrder.length - 1 ? 'disabled' : ''}>
                            <i class="fa-solid fa-chevron-down"></i>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // Drag and drop handlers
        let draggedItem = null;

        function handleDragStart(e) {
            draggedItem = e.target.closest('.slide-item');
            draggedItem.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/plain', draggedItem.dataset.orderIndex);
        }

        function handleDragOver(e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            const target = e.target.closest('.slide-item');
            if (target && target !== draggedItem) {
                target.classList.add('drag-over');
            }
        }

        function handleDragLeave(e) {
            const target = e.target.closest('.slide-item');
            if (target) {
                target.classList.remove('drag-over');
            }
        }

        function handleDrop(e) {
            e.preventDefault();
            const target = e.target.closest('.slide-item');
            if (target) {
                target.classList.remove('drag-over');
            }

            if (!target || target === draggedItem) return;

            const fromIndex = parseInt(draggedItem.dataset.orderIndex);
            const toIndex = parseInt(target.dataset.orderIndex);

            // Reorder the slideOrder array
            const [movedItem] = slideOrder.splice(fromIndex, 1);
            slideOrder.splice(toIndex, 0, movedItem);

            // Rebuild UI
            buildSlideSelector();
            updateSlideVisuals();
        }

        function handleDragEnd(e) {
            if (draggedItem) {
                draggedItem.classList.remove('dragging');
            }
            document.querySelectorAll('.slide-item').forEach(item => {
                item.classList.remove('drag-over');
            });
            draggedItem = null;
        }

        // Move slide up/down with buttons
        function moveSlideUp(orderIndex) {
            if (orderIndex <= 0) return;
            [slideOrder[orderIndex], slideOrder[orderIndex - 1]] = [slideOrder[orderIndex - 1], slideOrder[orderIndex]];
            buildSlideSelector();
            updateSlideVisuals();
        }

        function moveSlideDown(orderIndex) {
            if (orderIndex >= slideOrder.length - 1) return;
            [slideOrder[orderIndex], slideOrder[orderIndex + 1]] = [slideOrder[orderIndex + 1], slideOrder[orderIndex]];
            buildSlideSelector();
            updateSlideVisuals();
        }

        // Reset to original order
        function resetOrder() {
            slideOrder = [...originalOrder];
            buildSlideSelector();
            updateSlideVisuals();
        }

        function toggleSlideFromItem(index, event) {
            if (event.target.tagName !== 'INPUT') {
                toggleSlide(index);
                document.getElementById(`slide-check-${index}`).checked = selectedSlides.has(index);
            }
        }

        function toggleSlide(index) {
            if (selectedSlides.has(index)) {
                selectedSlides.delete(index);
            } else {
                selectedSlides.add(index);
            }
            updateSlideVisuals();
        }

        function selectAllSlides() {
            selectedSlides = new Set(slides.map((_, i) => i));
            updateSlideVisuals();
            buildSlideSelector();
        }

        function selectNoSlides() {
            selectedSlides.clear();
            updateSlideVisuals();
            buildSlideSelector();
        }

        function updateSlideVisuals() {
            document.querySelectorAll('.slide-wrapper').forEach((wrapper, index) => {
                if (selectedSlides.has(index)) {
                    wrapper.classList.add('selected');
                    wrapper.classList.remove('excluded');
                } else {
                    wrapper.classList.remove('selected');
                    wrapper.classList.add('excluded');
                }
            });
        }

        // Load all slides using iframes (same as presentation.html)
        function loadSlides() {
            slides.forEach((slide, index) => {
                const wrapper = document.createElement('div');
                wrapper.className = 'slide-wrapper selected';
                wrapper.id = `slide-wrapper-${index}`;
                wrapper.dataset.index = index;

                const iframe = document.createElement('iframe');
                iframe.id = `slide-iframe-${index}`;
                iframe.src = slide.file;
                iframe.onload = function() {
                    loadedIframes++;
                    loadingText.textContent = `Loading slide ${loadedIframes}/${slides.length}: ${slides[loadedIframes - 1]?.title || ''}`;

                    // When all iframes are loaded
                    if (loadedIframes === slides.length) {
                        // Wait longer for charts to fully initialize (ECharts needs time)
                        loadingText.textContent = 'Initializing charts...';
                        setTimeout(() => {
                            loadingOverlay.style.display = 'none';
                        }, 3000);
                    }
                };

                wrapper.appendChild(iframe);
                container.appendChild(wrapper);
            });

            // Build slide selector
            buildSlideSelector();
        }

        // Convert all canvas elements (charts) to images within iframe
        async function convertChartsToImages(iframeDoc) {
            const canvases = iframeDoc.querySelectorAll('canvas');
            const convertedCanvases = [];

            for (const canvas of canvases) {
                try {
                    // Skip if canvas is empty or has no content
                    if (canvas.width === 0 || canvas.height === 0) continue;

                    // Get canvas data URL
                    const dataUrl = canvas.toDataURL('image/png');

                    // Get computed styles and position
                    const rect = canvas.getBoundingClientRect();
                    const parentRect = canvas.parentElement.getBoundingClientRect();

                    // Create an image element
                    const img = iframeDoc.createElement('img');
                    img.src = dataUrl;
                    img.className = 'chart-export-image';
                    img.style.width = canvas.offsetWidth + 'px';
                    img.style.height = canvas.offsetHeight + 'px';
                    img.style.display = 'block';

                    // Store reference for cleanup
                    convertedCanvases.push({ canvas, img });

                    // Replace canvas with image in the DOM
                    canvas.parentNode.insertBefore(img, canvas);
                    canvas.setAttribute('data-export-hidden', 'true');
                    canvas.style.visibility = 'hidden';
                    canvas.style.position = 'absolute';
                } catch (e) {
                    console.warn('Could not convert canvas:', e);
                }
            }

            return convertedCanvases;
        }

        // Restore canvases after export
        function restoreCanvases(iframeDoc) {
            // Remove temporary images
            const tempImages = iframeDoc.querySelectorAll('.chart-export-image');
            tempImages.forEach(img => img.remove());

            // Restore hidden canvases
            const hiddenCanvases = iframeDoc.querySelectorAll('canvas[data-export-hidden]');
            hiddenCanvases.forEach(canvas => {
                canvas.style.visibility = '';
                canvas.style.position = '';
                canvas.removeAttribute('data-export-hidden');
            });
        }

        // Preload and convert external images to base64
        async function convertExternalImages(iframeDoc) {
            const images = iframeDoc.querySelectorAll('img');
            const bgElements = iframeDoc.querySelectorAll('[style*="background-image"]');

            // Convert img elements
            for (const img of images) {
                if (img.src && img.src.startsWith('http') && !img.src.startsWith(window.location.origin)) {
                    try {
                        const response = await fetch(img.src, { mode: 'cors' });
                        const blob = await response.blob();
                        const dataUrl = await new Promise((resolve) => {
                            const reader = new FileReader();
                            reader.onloadend = () => resolve(reader.result);
                            reader.readAsDataURL(blob);
                        });
                        img.src = dataUrl;
                    } catch (e) {
                        console.warn('Could not convert image:', img.src, e);
                    }
                }
            }
        }

        // Extract Google Drive file ID from various URL formats
        function extractDriveFileId(url) {
            // Format: /file/d/FILE_ID/preview or /file/d/FILE_ID/view
            const match = url.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
            return match ? match[1] : null;
        }

        // Handle Google Drive iframes - replace with thumbnail images
        async function handleVideoIframes(iframeDoc) {
            // Find all Google Drive iframes
            const driveIframes = iframeDoc.querySelectorAll('iframe[src*="drive.google.com"]');

            for (const iframe of driveIframes) {
                // Hide the iframe completely
                iframe.style.display = 'none';
                iframe.style.visibility = 'hidden';
                iframe.style.position = 'absolute';
                iframe.style.pointerEvents = 'none';

                // Get parent container dimensions
                const parent = iframe.parentElement;
                const parentHeight = parent?.offsetHeight || 200;
                const parentWidth = parent?.offsetWidth || 300;

                // Extract file ID to create thumbnail URL
                const fileId = extractDriveFileId(iframe.src);

                // Check if there's already a fallback
                const existingFallback = iframe.nextElementSibling;
                if (existingFallback && (existingFallback.classList.contains('video-fallback') ||
                    existingFallback.classList.contains('video-export-placeholder') ||
                    existingFallback.id?.includes('video-placeholder'))) {
                    // Hide existing fallback, we'll create a thumbnail instead
                    existingFallback.style.display = 'none';
                }

                // Create thumbnail placeholder with Google Drive thumbnail
                const placeholder = iframeDoc.createElement('div');
                placeholder.className = 'video-export-placeholder';
                placeholder.style.cssText = `
                    display: flex !important;
                    position: relative;
                    width: 100%;
                    height: 100%;
                    min-height: ${parentHeight}px;
                    background: #0f172a;
                    border-radius: 8px;
                    overflow: hidden;
                    box-sizing: border-box;
                `;

                if (fileId) {
                    // Try multiple approaches to get the thumbnail
                    const thumbnailUrl = `https://drive.google.com/thumbnail?id=${fileId}&sz=w1000`;

                    // Try to fetch via CORS proxy or direct fetch
                    let thumbnailDataUrl = null;

                    // Method 1: Try direct fetch (works if running on same origin or CORS allowed)
                    try {
                        const response = await fetch(thumbnailUrl, {
                            mode: 'cors',
                            credentials: 'omit'
                        });
                        if (response.ok) {
                            const blob = await response.blob();
                            thumbnailDataUrl = await new Promise((resolve) => {
                                const reader = new FileReader();
                                reader.onloadend = () => resolve(reader.result);
                                reader.readAsDataURL(blob);
                            });
                        }
                    } catch (e) {
                        console.log('Direct fetch failed, trying proxy...', e);
                    }

                    // Method 2: Try CORS proxies if direct fetch failed
                    const corsProxies = [
                        `https://api.allorigins.win/raw?url=${encodeURIComponent(thumbnailUrl)}`,
                        `https://corsproxy.io/?${encodeURIComponent(thumbnailUrl)}`,
                        `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(thumbnailUrl)}`
                    ];

                    for (const proxyUrl of corsProxies) {
                        if (thumbnailDataUrl) break;
                        try {
                            const response = await fetch(proxyUrl);
                            if (response.ok) {
                                const blob = await response.blob();
                                // Check if it's actually an image
                                if (blob.type.startsWith('image/')) {
                                    thumbnailDataUrl = await new Promise((resolve) => {
                                        const reader = new FileReader();
                                        reader.onloadend = () => resolve(reader.result);
                                        reader.readAsDataURL(blob);
                                    });
                                }
                            }
                        } catch (e) {
                            console.log('Proxy fetch failed:', proxyUrl, e);
                        }
                    }

                    if (thumbnailDataUrl) {
                        // Successfully got thumbnail as base64
                        placeholder.innerHTML = `
                            <img src="${thumbnailDataUrl}"
                                 style="width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0;">
                            <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 60px; height: 60px; border-radius: 50%; background: rgba(0, 0, 0, 0.6); display: flex; align-items: center; justify-content: center; pointer-events: none;">
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="white">
                                    <polygon points="5 3 19 12 5 21 5 3"></polygon>
                                </svg>
                            </div>
                        `;
                    } else {
                        // Fallback to styled placeholder
                        placeholder.innerHTML = `
                            <div style="display: flex; position: absolute; top: 0; left: 0; width: 100%; height: 100%; flex-direction: column; align-items: center; justify-content: center; background: linear-gradient(135deg, rgba(30, 41, 59, 0.95), rgba(15, 23, 42, 1));">
                                <div style="width: 70px; height: 70px; border-radius: 50%; background: rgba(34, 211, 238, 0.15); border: 3px solid rgba(34, 211, 238, 0.5); display: flex; align-items: center; justify-content: center; margin-bottom: 12px;">
                                    <svg width="28" height="28" viewBox="0 0 24 24" fill="#22d3ee">
                                        <polygon points="5 3 19 12 5 21 5 3"></polygon>
                                    </svg>
                                </div>
                                <div style="font-weight: 600; color: #e2e8f0; font-size: 14px;">Demo Video</div>
                                <div style="color: #64748b; font-size: 11px; margin-top: 4px;">View in presentation</div>
                            </div>
                        `;
                    }
                } else {
                    // Fallback if we can't extract file ID
                    placeholder.innerHTML = `
                        <div style="display: flex; position: absolute; top: 0; left: 0; width: 100%; height: 100%; flex-direction: column; align-items: center; justify-content: center; background: linear-gradient(135deg, rgba(30, 41, 59, 0.9), rgba(15, 23, 42, 0.95));">
                            <div style="width: 50px; height: 50px; border-radius: 50%; background: rgba(34, 211, 238, 0.2); border: 2px solid rgba(34, 211, 238, 0.5); display: flex; align-items: center; justify-content: center; margin-bottom: 10px;">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="#22d3ee">
                                    <polygon points="5 3 19 12 5 21 5 3"></polygon>
                                </svg>
                            </div>
                            <div style="font-weight: 600; color: #e2e8f0;">Video</div>
                        </div>
                    `;
                }

                iframe.parentNode.insertBefore(placeholder, iframe);
            }

            // Wait for thumbnail images to load
            await new Promise(resolve => setTimeout(resolve, 500));

            // Also handle Google Drive thumbnail images that might fail
            const driveImages = iframeDoc.querySelectorAll('img[src*="drive.google.com"]');
            driveImages.forEach(img => {
                // Check if image failed to load
                if (!img.complete || img.naturalWidth === 0) {
                    img.style.display = 'none';
                    const fallback = img.nextElementSibling;
                    if (fallback) {
                        fallback.style.display = 'flex';
                    }
                }
            });
        }

        // Restore video iframes after export
        function restoreVideoIframes(iframeDoc) {
            // Restore Google Drive iframes
            const driveIframes = iframeDoc.querySelectorAll('iframe[src*="drive.google.com"]');
            driveIframes.forEach(iframe => {
                iframe.style.display = '';
            });

            // Hide fallbacks
            const fallbacks = iframeDoc.querySelectorAll('.video-fallback, [id*="video-placeholder"]');
            fallbacks.forEach(fb => {
                fb.style.display = 'none';
            });

            // Remove created placeholders
            const placeholders = iframeDoc.querySelectorAll('.video-export-placeholder');
            placeholders.forEach(p => p.remove());
        }

        // Export selected slides to PDF using html2canvas
        async function exportToPDF() {
            // Get selected slides in the user-defined order
            const selectedIndices = slideOrder.filter(idx => selectedSlides.has(idx));

            if (selectedIndices.length === 0) {
                alert('Please select at least one slide to export.');
                return;
            }

            const exportBtn = document.getElementById('exportBtn');
            const progressBar = document.getElementById('progressBar');
            const progressFill = document.getElementById('progressFill');
            const progressText = document.getElementById('progressText');

            exportBtn.disabled = true;
            progressBar.classList.add('active');
            progressText.classList.add('active');

            try {
                const { jsPDF } = window.jspdf;

                // Create PDF with slide dimensions (1280x720 = 16:9 aspect ratio)
                const pdf = new jsPDF({
                    orientation: 'landscape',
                    unit: 'px',
                    format: [1280, 720],
                    hotfixes: ['px_scaling']
                });

                let isFirstPage = true;

                for (let i = 0; i < selectedIndices.length; i++) {
                    const slideIndex = selectedIndices[i];
                    const iframe = document.getElementById(`slide-iframe-${slideIndex}`);

                    if (!iframe) continue;

                    progressText.textContent = `Preparing slide ${i + 1}/${selectedIndices.length}: ${slides[slideIndex].title}`;
                    progressFill.style.width = `${((i + 0.3) / selectedIndices.length) * 100}%`;

                    try {
                        // Access iframe content
                        const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
                        const slideContainer = iframeDoc.querySelector('.slide-container');

                        if (!slideContainer) {
                            console.log(`No slide container found for slide ${slideIndex}`);
                            continue;
                        }

                        // Scroll iframe into view to ensure it's rendered
                        iframe.scrollIntoView({ behavior: 'instant' });
                        await new Promise(resolve => setTimeout(resolve, 200));

                        // Convert charts (canvas elements) to images BEFORE html2canvas
                        progressText.textContent = `Converting charts in slide ${i + 1}/${selectedIndices.length}...`;
                        await convertChartsToImages(iframeDoc);

                        // Handle video iframes - replace with thumbnails
                        progressText.textContent = `Loading video thumbnails for slide ${i + 1}/${selectedIndices.length}...`;
                        await handleVideoIframes(iframeDoc);

                        // Wait for thumbnails and chart images to render
                        await new Promise(resolve => setTimeout(resolve, 300));

                        progressText.textContent = `Rendering slide ${i + 1}/${selectedIndices.length}: ${slides[slideIndex].title}`;
                        progressFill.style.width = `${((i + 0.6) / selectedIndices.length) * 100}%`;

                        // Capture slide using html2canvas with improved settings
                        const canvas = await html2canvas(slideContainer, {
                            width: 1280,
                            height: 720,
                            scale: 2,
                            useCORS: true,
                            allowTaint: true,
                            backgroundColor: '#0f172a',
                            logging: false,
                            foreignObjectRendering: false,
                            imageTimeout: 15000,
                            removeContainer: true,
                            onclone: (clonedDoc, element) => {
                                // Ensure dimensions are correct
                                element.style.width = '1280px';
                                element.style.height = '720px';
                                element.style.overflow = 'hidden';
                                element.style.transform = 'none';

                                // FIX: Handle gradient text (text-transparent bg-clip-text)
                                // html2canvas cannot render this, so convert to solid color
                                const gradientTexts = element.querySelectorAll('.text-transparent, [class*="bg-clip-text"]');
                                gradientTexts.forEach(el => {
                                    // Remove the transparent text and background-clip
                                    el.style.color = '#22d3ee'; // Use cyan color instead
                                    el.style.backgroundClip = 'unset';
                                    el.style.webkitBackgroundClip = 'unset';
                                    el.style.backgroundImage = 'none';
                                    el.classList.remove('text-transparent');
                                });

                                // Handle background images that use external URLs
                                const bgOverlay = element.querySelector('.bg-overlay');
                                if (bgOverlay) {
                                    // Remove problematic external background images
                                    bgOverlay.style.backgroundImage = 'none';
                                    bgOverlay.style.backgroundColor = 'rgba(15, 23, 42, 0.3)';
                                }
                                const bgPattern = element.querySelector('.bg-pattern');
                                if (bgPattern) {
                                    bgPattern.style.backgroundImage = 'none';
                                    bgPattern.style.backgroundColor = 'rgba(15, 23, 42, 0.15)';
                                }

                                // Handle Google Drive iframes in cloned doc - they can't be captured
                                const driveIframes = element.querySelectorAll('iframe[src*="drive.google.com"]');
                                driveIframes.forEach(iframe => {
                                    // Hide iframe completely
                                    iframe.style.display = 'none';
                                    iframe.style.visibility = 'hidden';

                                    // Make sure fallback is visible
                                    const fallback = iframe.nextElementSibling;
                                    if (fallback && (fallback.classList.contains('video-fallback') ||
                                        fallback.classList.contains('video-export-placeholder') ||
                                        fallback.id?.includes('video-placeholder'))) {
                                        fallback.style.display = 'flex';
                                        fallback.style.visibility = 'visible';
                                    }
                                });

                                // Also find ALL video-fallback elements and make them visible
                                const allFallbacks = element.querySelectorAll('.video-fallback, [id*="video-placeholder"]');
                                allFallbacks.forEach(fb => {
                                    // Check if parent has a Google Drive iframe
                                    const parentDiv = fb.parentElement;
                                    const hasGDriveIframe = parentDiv?.querySelector('iframe[src*="drive.google.com"]');
                                    if (hasGDriveIframe) {
                                        fb.style.display = 'flex';
                                        fb.style.visibility = 'visible';
                                    }
                                });

                                // Handle Google Drive images that may fail CORS
                                const driveImages = element.querySelectorAll('img[src*="drive.google.com"]');
                                driveImages.forEach(img => {
                                    // Show fallback for Google Drive images
                                    const fallback = img.nextElementSibling;
                                    if (fallback) {
                                        img.style.display = 'none';
                                        fallback.style.display = 'flex';
                                    }
                                });
                            }
                        });

                        // Add new page if not first
                        if (!isFirstPage) {
                            pdf.addPage([1280, 720], 'landscape');
                        }
                        isFirstPage = false;

                        // Add image to PDF
                        const imgData = canvas.toDataURL('image/jpeg', 0.95);
                        pdf.addImage(imgData, 'JPEG', 0, 0, 1280, 720);

                        progressFill.style.width = `${((i + 1) / selectedIndices.length) * 100}%`;

                        // Restore canvases and video iframes for preview
                        restoreCanvases(iframeDoc);
                        restoreVideoIframes(iframeDoc);

                    } catch (slideError) {
                        console.error(`Error capturing slide ${slideIndex}:`, slideError);
                        // Continue with next slide
                    }
                }

                progressText.textContent = 'Saving PDF...';

                // Generate filename with date
                const date = new Date().toISOString().slice(0, 10);
                const filename = `AI_Robotics_Portfolio_${date}.pdf`;

                pdf.save(filename);

                progressText.textContent = 'PDF exported successfully!';
                setTimeout(() => {
                    progressBar.classList.remove('active');
                    progressText.classList.remove('active');
                    progressFill.style.width = '0%';
                }, 2000);

            } catch (error) {
                console.error('PDF export error:', error);
                progressText.textContent = `Error: ${error.message}`;
                setTimeout(() => {
                    progressBar.classList.remove('active');
                    progressText.classList.remove('active');
                }, 3000);
            }

            exportBtn.disabled = false;
        }

        // Start loading slides
        loadSlides();
    </script>
</body>
</html>
