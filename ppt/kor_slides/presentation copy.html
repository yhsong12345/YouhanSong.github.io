<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>AI & Robotics Researcher Portfolio - Presentation</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;800;900&amp;family=Noto+Sans+KR:wght@300;400;500;700;900&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
    body {
        margin: 0;
        padding: 0;
        font-family: 'Noto Sans KR', sans-serif;
        background-color: #0f172a;
        overflow: hidden;
    }
    
    .presentation-wrapper {
        width: 100vw;
        height: 100vh;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #0f172a;
    }
    
    .slide-wrapper {
        width: 1280px;
        height: 720px;
        position: relative;
        margin: auto;
        display: none;
    }
    
    .slide-wrapper.active {
        display: block;
    }
    
    .slide-wrapper iframe {
        width: 100%;
        height: 100%;
        border: none;
        background: #0f172a;
    }
    
    /* Navigation Controls */
    .nav-controls {
        position: fixed;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 1000;
        display: flex;
        gap: 15px;
        align-items: center;
        background: rgba(15, 23, 42, 0.9);
        backdrop-filter: blur(10px);
        padding: 12px 24px;
        border-radius: 50px;
        border: 1px solid rgba(56, 189, 248, 0.3);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }
    
    .nav-btn {
        background: rgba(34, 211, 238, 0.1);
        border: 1px solid rgba(34, 211, 238, 0.3);
        color: #22d3ee;
        padding: 10px 20px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 14px;
        font-weight: 600;
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        gap: 8px;
    }
    
    .nav-btn:hover {
        background: rgba(34, 211, 238, 0.2);
        border-color: rgba(34, 211, 238, 0.5);
        transform: translateY(-2px);
    }
    
    .nav-btn:disabled {
        opacity: 0.3;
        cursor: not-allowed;
    }
    
    .slide-counter {
        color: #94a3b8;
        font-size: 14px;
        padding: 0 15px;
        font-weight: 500;
    }
    
    /* PDF Export Controls - Hidden by default */
    .pdf-controls {
        position: fixed;
        top: 30px;
        right: 30px;
        z-index: 1000;
        background: rgba(15, 23, 42, 0.9);
        backdrop-filter: blur(10px);
        padding: 20px;
        border-radius: 16px;
        border: 1px solid rgba(56, 189, 248, 0.3);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        min-width: 300px;
        max-height: 80vh;
        overflow-y: auto;
        display: none; /* Hidden by default */
    }
    
    .pdf-controls.visible {
        display: block;
    }
    
    
    .pdf-controls h3 {
        color: #22d3ee;
        font-size: 16px;
        font-weight: 700;
        margin-bottom: 15px;
        display: flex;
        align-items: center;
        gap: 8px;
    }
    
    .slide-selector {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-bottom: 15px;
        max-height: 400px;
        overflow-y: auto;
    }
    
    .slide-checkbox {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px;
        border-radius: 6px;
        cursor: pointer;
        transition: background 0.2s;
    }
    
    .slide-checkbox:hover {
        background: rgba(34, 211, 238, 0.1);
    }
    
    .slide-checkbox input[type="checkbox"] {
        width: 18px;
        height: 18px;
        cursor: pointer;
        accent-color: #22d3ee;
    }
    
    .slide-checkbox label {
        color: #e2e8f0;
        font-size: 13px;
        cursor: pointer;
        flex: 1;
    }
    
    .pdf-actions {
        display: flex;
        flex-direction: column;
        gap: 10px;
    }
    
    .pdf-btn {
        background: linear-gradient(135deg, #06b6d4, #3b82f6);
        border: none;
        color: white;
        padding: 12px 20px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 14px;
        font-weight: 600;
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
    }
    
    .pdf-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 20px rgba(6, 182, 212, 0.3);
    }
    
    .select-all-btns {
        display: flex;
        gap: 8px;
        margin-bottom: 10px;
    }
    
    .select-btn {
        flex: 1;
        background: rgba(34, 211, 238, 0.1);
        border: 1px solid rgba(34, 211, 238, 0.3);
        color: #22d3ee;
        padding: 8px 12px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 12px;
        font-weight: 500;
        transition: all 0.2s;
    }
    
    .select-btn:hover {
        background: rgba(34, 211, 238, 0.2);
    }
    
    /* Print Styles */
    @media print {
        @page {
            size: 1280px 720px;
            margin: 0;
        }
        
        body {
            margin: 0;
            padding: 0;
            background: #0f172a;
            width: 1280px;
            height: auto;
            overflow: visible;
        }
        
        .nav-controls,
        .pdf-controls {
            display: none !important;
        }
        
        .presentation-wrapper {
            width: 1280px !important;
            height: auto !important;
            margin: 0;
            padding: 0;
            overflow: visible;
            display: block !important;
            position: static !important;
            align-items: stretch !important;
            justify-content: flex-start !important;
        }
        
        .slide-wrapper {
            width: 1280px !important;
            height: 720px !important;
            max-width: 1280px !important;
            max-height: 720px !important;
            display: block !important;
            page-break-after: always !important;
            page-break-inside: avoid !important;
            margin: 0 !important;
            padding: 0 !important;
            overflow: hidden !important;
            position: relative !important;
        }
        
        .slide-wrapper:last-child {
            page-break-after: auto !important;
        }
        
        .slide-wrapper iframe {
            width: 1280px !important;
            height: 720px !important;
            max-width: 1280px !important;
            max-height: 720px !important;
            border: none !important;
            overflow: hidden !important;
        }
        
        * {
            -webkit-print-color-adjust: exact !important;
            print-color-adjust: exact !important;
            color-adjust: exact !important;
        }
    }
    
    /* Fix for project names alignment - will be applied via CSS injection */
    .project-name-fix {
        text-align: left !important;
        justify-content: flex-start !important;
    }
</style>
</head>
<body>
<div class="presentation-wrapper">
    <!-- PDF Export Controls (Hidden by default) -->
    <div class="pdf-controls" id="pdfControls">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <h3 style="margin: 0;"><i class="fa-solid fa-file-pdf"></i> PDF Export</h3>
            <button onclick="togglePDFControls()" style="background: transparent; border: none; color: #94a3b8; cursor: pointer; font-size: 20px; padding: 0; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center;">
                <i class="fa-solid fa-times"></i>
            </button>
        </div>
        <div class="select-all-btns">
            <button class="select-btn" onclick="selectAllSlides()">Select All</button>
            <button class="select-btn" onclick="deselectAllSlides()">Deselect All</button>
        </div>
        <div class="slide-selector" id="slideSelector"></div>
        <div class="pdf-actions">
            <button class="pdf-btn" onclick="exportSelectedSlides()">
                <i class="fa-solid fa-download"></i> Export Selected to PDF
            </button>
            <button class="pdf-btn" onclick="exportAllSlides()" style="background: linear-gradient(135deg, #8b5cf6, #ec4899);">
                <i class="fa-solid fa-file-export"></i> Export All Slides
            </button>
        </div>
    </div>
    
    <!-- Navigation Controls -->
    <div class="nav-controls">
        <button class="nav-btn" onclick="previousSlide()" id="prevBtn">
            <i class="fa-solid fa-chevron-left"></i> Previous
        </button>
        <div class="slide-counter">
            <span id="currentSlide">1</span> / <span id="totalSlides">18</span>
        </div>
        <button class="nav-btn" onclick="nextSlide()" id="nextBtn">
            Next <i class="fa-solid fa-chevron-right"></i>
        </button>
        <button class="nav-btn" onclick="toggleFullscreen()">
            <i class="fa-solid fa-expand"></i> Fullscreen
        </button>
        <button class="nav-btn" onclick="window.open('printable.html', '_blank')" title="Open print-friendly version (Ctrl+P)">
            <i class="fa-solid fa-print"></i> Print PDF
        </button>
    </div>
    
    <!-- Slide Containers -->
    <div id="slideContainer"></div>
</div>

<script>
    // ============================================================
    // SLIDE ORDER CONFIGURATION
    // To add a new project slide:
    //   1. Create your new HTML file (e.g., 'proj_new_project.html')
    //   2. Add an entry to the 'slides' array below at the desired position
    //   3. The order in this array determines the presentation order
    // ============================================================

    const slides = [
        // === INTRO SECTION ===
        { file: 'slide01.html', title: 'Title - AI & Robotics Researcher' },
        { file: 'slide02.html', title: 'Researcher Profile' },
        { file: 'slide03.html', title: 'Education & Career Timeline' },
        { file: 'slide04.html', title: 'Core Competencies & Skills' },

        // === PROJECT SECTION (ORDER: LATEST FIRST) ===
        // Personal Projects (Latest)
        { file: 'slide14.html', title: 'Universal VLA Model' },
        { file: 'slide15.html', title: 'EASIS: Embodiment-Agnostic Swarm Intelligence System' },

        // Work Projects (Recent to Old)
        { file: 'slide18.html', title: 'Smart Monitoring System' },
        { file: 'slide05.html', title: 'Korean LLM Development' },
        { file: 'slide06.html', title: 'SEEU Track - Vehicle Detection' },
        { file: 'slide07.html', title: 'Face Recognition System' },
        { file: 'slide08.html', title: 'SEEU ID - ID Card OCR' },
        { file: 'slide09.html', title: 'Tanzania Smart Gate' },
        { file: 'slide10.html', title: 'Gumi Metaverse - Safety Detection' },
        { file: 'slide11.html', title: 'AVA Project - Autonomous Driving' },
        { file: 'slide12.html', title: 'Robotic Arm Object Relocator' },
        { file: 'slide13.html', title: 'Nvidia Jetson AMR' },

        // === CLOSING SECTION ===
        { file: 'slide16.html', title: 'Key Achievements Summary' },
        { file: 'slide17.html', title: 'Thank You' },
    ];

    // Auto-generate arrays from slides config
    const slideFiles = slides.map(s => s.file);
    const slideTitles = slides.map(s => s.title);
    const totalSlides = slides.length;
    let currentSlideIndex = 0;
    
    // Initialize slides
    function initSlides() {
        const container = document.getElementById('slideContainer');
        slideFiles.forEach((file, index) => {
            const wrapper = document.createElement('div');
            wrapper.className = 'slide-wrapper';
            wrapper.id = `slide-${index + 1}`;
            if (index === 0) wrapper.classList.add('active');
            
            const iframe = document.createElement('iframe');
            iframe.src = file;
            iframe.id = `iframe-${index + 1}`;
            iframe.onload = function() {
                // Fix project name alignment after iframe loads
                setTimeout(() => {
                    fixProjectNames(iframe);
                    initializeCharts(iframe);
                    injectPrintStyles(iframe);
                }, 500);
                
                // Also check when slide becomes active
                const observer = new MutationObserver(() => {
                    if (wrapper.classList.contains('active')) {
                        setTimeout(() => {
                            fixProjectNames(iframe);
                            initializeCharts(iframe);
                            injectPrintStyles(iframe);
                        }, 300);
                    }
                });
                observer.observe(wrapper, { attributes: true, attributeFilter: ['class'] });
            };
            
            wrapper.appendChild(iframe);
            container.appendChild(wrapper);
        });
        
        // Initialize slide selector
        initSlideSelector();
        updateNavigation();
    }
    
    // Fix project names alignment and date positioning
    function fixProjectNames(iframe) {
        try {
            const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
            if (!iframeDoc) return;

            // Inject CSS to fix project name alignment and date positioning
            const style = iframeDoc.createElement('style');
            style.textContent = `
                /* Fix project headers - ensure left alignment */
                .relative.z-10.px-8 > div:first-child,
                .relative.z-10.px-10 > div:first-child,
                .relative.z-10.px-12 > div:first-child {
                    text-align: left !important;
                    justify-content: flex-start !important;
                }

                /* Fix h1 project titles */
                h1.font-\\['Montserrat'\\],
                h1.text-3xl,
                h1.text-4xl,
                h1.text-2xl {
                    text-align: left !important;
                }

                /* Fix header containers */
                .flex.justify-between.items-start > div:first-child {
                    text-align: left !important;
                    align-items: flex-start !important;
                }

                /* Ensure project name sections are left-aligned */
                .relative.z-10.px-8 .flex.items-center.space-x-3,
                .relative.z-10.px-10 .flex.items-center.space-x-3,
                .relative.z-10.px-12 .flex.items-center.space-x-3 {
                    justify-content: flex-start !important;
                }

                /* Fix date positioning - ensure it stays in top right */
                .flex.justify-between.items-start > div.text-right,
                .flex.justify-between.items-start > div:last-child {
                    position: absolute !important;
                    top: 20px !important;
                    right: 48px !important;
                    text-align: right !important;
                    z-index: 20 !important;
                }

                /* Ensure header container is relative for absolute positioning */
                .relative.z-10.px-8.flex.justify-between.items-start,
                .relative.z-10.px-10.flex.justify-between.items-start,
                .relative.z-10.px-12.flex.justify-between.items-start {
                    position: relative !important;
                }
            `;
            iframeDoc.head.appendChild(style);
            
            // Also fix specific elements
            const headers = iframeDoc.querySelectorAll('h1');
            headers.forEach(header => {
                const text = header.textContent || '';
                if (text.includes('LLM') || text.includes('SEEU') || text.includes('Face') ||
                    text.includes('AVA') || text.includes('Robotic') || text.includes('Tanzania') ||
                    text.includes('Gumi') || text.includes('Project') || text.includes('한국어') ||
                    text.includes('ID') || text.includes('Track')) {
                    header.style.textAlign = 'left';
                    const parent = header.closest('.flex');
                    if (parent) {
                        parent.style.justifyContent = 'flex-start';
                    }
                }
            });

            // Fix date positioning directly
            const headerContainers = iframeDoc.querySelectorAll('.flex.justify-between.items-start');
            headerContainers.forEach(container => {
                // Make container relative if not already
                container.style.position = 'relative';

                // Find the date element (usually the last child or has text-right class)
                const dateElement = container.querySelector('.text-right') || container.lastElementChild;
                if (dateElement && dateElement !== container.firstElementChild) {
                    dateElement.style.position = 'absolute';
                    dateElement.style.top = '0';
                    dateElement.style.right = '0';
                    dateElement.style.textAlign = 'right';
                    dateElement.style.zIndex = '20';
                }
            });
        } catch (e) {
            console.log('Could not access iframe content:', e);
        }
    }
    
    // Initialize charts in iframe
    function initializeCharts(iframe) {
        try {
            const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
            if (!iframeDoc) return;
            
            // Wait for ECharts to be available and ensure charts are visible
            const checkCharts = setInterval(() => {
                if (iframe.contentWindow.echarts && iframeDoc.querySelectorAll('[id*="chart"], [id*="Chart"]').length > 0) {
                    // Trigger resize to ensure charts render
                    iframe.contentWindow.dispatchEvent(new Event('resize'));
                    
                    // Get all chart containers and ensure they're visible
                    const chartContainers = iframeDoc.querySelectorAll('[id*="chart"], [id*="Chart"]');
                    chartContainers.forEach(container => {
                        container.style.visibility = 'visible';
                        container.style.opacity = '1';
                        container.style.display = 'block';
                    });
                    
                    clearInterval(checkCharts);
                }
            }, 200);
            
            // Stop checking after 5 seconds
            setTimeout(() => clearInterval(checkCharts), 5000);
        } catch (e) {
            console.log('Could not initialize charts:', e);
        }
    }
    
    // Convert ECharts to static images for PDF export
    function convertChartsToImages(iframe) {
        try {
            const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
            const iframeWin = iframe.contentWindow;
            if (!iframeDoc || !iframeWin) return;

            // Show SVG gauge fallbacks if they exist
            const svgGauges = iframeDoc.querySelectorAll('.svg-gauge');
            svgGauges.forEach(svg => {
                svg.style.display = 'block';
            });

            // Find all canvas elements (ECharts renders to canvas)
            const canvases = iframeDoc.querySelectorAll('canvas');
            canvases.forEach(canvas => {
                // Check if already converted
                if (canvas.getAttribute('data-converted') === 'true') return;

                try {
                    // Get canvas dimensions
                    const rect = canvas.getBoundingClientRect();
                    const width = rect.width || canvas.width;
                    const height = rect.height || canvas.height;

                    if (width > 0 && height > 0) {
                        // Convert canvas to data URL
                        const dataUrl = canvas.toDataURL('image/png', 1.0);

                        // Create an image element
                        const img = iframeDoc.createElement('img');
                        img.src = dataUrl;
                        img.className = 'chart-print-image';
                        img.style.cssText = `
                            position: absolute;
                            top: 0;
                            left: 0;
                            width: ${width}px;
                            height: ${height}px;
                            display: block;
                            z-index: 1000;
                        `;

                        // Make parent relative if needed
                        const parent = canvas.parentElement;
                        if (parent) {
                            const parentStyle = iframeWin.getComputedStyle(parent);
                            if (parentStyle.position === 'static') {
                                parent.style.position = 'relative';
                            }
                            parent.appendChild(img);
                        }

                        // Hide the canvas
                        canvas.style.display = 'none';
                        canvas.setAttribute('data-converted', 'true');
                    }
                } catch (canvasErr) {
                    console.log('Could not convert canvas:', canvasErr);
                    // If canvas conversion fails, hide it and rely on SVG fallback
                    canvas.style.display = 'none';
                }
            });

            // Also try ECharts getDataURL method if echarts is available
            if (iframeWin.echarts) {
                const chartContainers = iframeDoc.querySelectorAll('[id*="chart"], [id*="Chart"], .chart-container');
                chartContainers.forEach(container => {
                    if (container.getAttribute('data-echarts-converted') === 'true') return;

                    const chartInstance = iframeWin.echarts.getInstanceByDom(container);
                    if (chartInstance) {
                        try {
                            const dataUrl = chartInstance.getDataURL({
                                type: 'png',
                                pixelRatio: 2,
                                backgroundColor: 'transparent'
                            });

                            const img = iframeDoc.createElement('img');
                            img.src = dataUrl;
                            img.className = 'echarts-print-image';
                            img.style.cssText = `
                                position: absolute;
                                top: 0;
                                left: 0;
                                width: 100%;
                                height: 100%;
                                display: block;
                                object-fit: contain;
                                z-index: 1001;
                            `;

                            container.style.position = 'relative';
                            container.appendChild(img);
                            container.setAttribute('data-echarts-converted', 'true');

                            // Hide the canvas inside
                            const canvas = container.querySelector('canvas');
                            if (canvas) {
                                canvas.style.display = 'none';
                            }
                        } catch (chartErr) {
                            console.log('Could not convert ECharts:', chartErr);
                        }
                    }
                });
            }
        } catch (e) {
            console.log('Could not convert charts to images:', e);
        }
    }

    // Restore charts from images after PDF export
    function restoreChartsFromImages(iframe) {
        try {
            const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
            if (!iframeDoc) return;

            // Hide SVG gauge fallbacks
            const svgGauges = iframeDoc.querySelectorAll('.svg-gauge');
            svgGauges.forEach(svg => {
                svg.style.display = 'none';
            });

            // Restore canvases
            const convertedCanvases = iframeDoc.querySelectorAll('canvas[data-converted="true"]');
            convertedCanvases.forEach(canvas => {
                canvas.style.display = '';
                canvas.style.visibility = '';
                canvas.removeAttribute('data-converted');
            });

            // Remove canvas print images
            const canvasImages = iframeDoc.querySelectorAll('.chart-print-image');
            canvasImages.forEach(img => img.remove());

            // Restore ECharts containers
            const chartContainers = iframeDoc.querySelectorAll('[data-echarts-converted="true"]');
            chartContainers.forEach(container => {
                const img = container.querySelector('.echarts-print-image');
                if (img) img.remove();

                const canvas = container.querySelector('canvas');
                if (canvas) {
                    canvas.style.display = '';
                    canvas.style.visibility = '';
                }

                container.removeAttribute('data-echarts-converted');
            });
        } catch (e) {
            console.log('Could not restore charts:', e);
        }
    }

    // Create video placeholder for PDF export
    function createVideoPlaceholders(iframe) {
        try {
            const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
            if (!iframeDoc) return;

            const videoIframes = iframeDoc.querySelectorAll('iframe[src*="drive.google.com"], iframe[src*="youtube.com"], iframe[src*="youtu.be"]');
            videoIframes.forEach(videoIframe => {
                if (videoIframe.getAttribute('data-placeholder-created') === 'true') return;

                const parent = videoIframe.parentElement;
                if (!parent) return;

                // Get parent dimensions
                const parentRect = parent.getBoundingClientRect();
                const width = parentRect.width || 300;
                const height = parentRect.height || 200;

                // Create a styled placeholder div
                const placeholder = iframeDoc.createElement('div');
                placeholder.className = 'video-print-placeholder';
                placeholder.style.cssText = `
                    display: flex;
                    flex-direction: column;
                    align-items: center;
                    justify-content: center;
                    width: ${width}px;
                    height: ${height}px;
                    background: linear-gradient(135deg, rgba(15, 23, 42, 0.9) 0%, rgba(30, 41, 59, 0.9) 100%);
                    border: 2px solid rgba(34, 211, 238, 0.5);
                    border-radius: 12px;
                    color: #94a3b8;
                    position: relative;
                `;

                placeholder.innerHTML = `
                    <div style="width: 70px; height: 70px; background: rgba(34, 211, 238, 0.2); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-bottom: 12px; border: 2px solid rgba(34, 211, 238, 0.5);">
                        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#22d3ee" stroke-width="2">
                            <polygon points="5 3 19 12 5 21 5 3"></polygon>
                        </svg>
                    </div>
                    <span style="font-size: 14px; font-weight: 600; color: #e2e8f0;">Video Content</span>
                    <span style="font-size: 11px; color: #64748b; margin-top: 4px;">Available in browser</span>
                `;

                // Hide video iframe, show placeholder
                videoIframe.style.display = 'none';
                videoIframe.setAttribute('data-placeholder-created', 'true');
                parent.appendChild(placeholder);
            });
        } catch (e) {
            console.log('Could not create video placeholders:', e);
        }
    }

    // Remove video placeholders after PDF export
    function removeVideoPlaceholders(iframe) {
        try {
            const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
            if (!iframeDoc) return;

            // Restore video iframes
            const videoIframes = iframeDoc.querySelectorAll('iframe[data-placeholder-created="true"]');
            videoIframes.forEach(videoIframe => {
                videoIframe.style.display = '';
                videoIframe.removeAttribute('data-placeholder-created');
            });

            // Remove placeholders
            const placeholders = iframeDoc.querySelectorAll('.video-print-placeholder');
            placeholders.forEach(p => p.remove());
        } catch (e) {
            console.log('Could not remove video placeholders:', e);
        }
    }

    // Inject print styles into iframe for video handling
    function injectPrintStyles(iframe) {
        try {
            const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
            if (!iframeDoc) return;
            
            // Check if print styles already exist
            if (iframeDoc.getElementById('pdf-print-styles')) return;
            
            const printStyle = iframeDoc.createElement('style');
            printStyle.id = 'pdf-print-styles';
            printStyle.textContent = `
                @media print {
                    @page {
                        size: 1280px 720px;
                        margin: 0;
                    }
                    body, html {
                        width: 1280px !important;
                        height: 720px !important;
                        max-width: 1280px !important;
                        max-height: 720px !important;
                        margin: 0 !important;
                        padding: 0 !important;
                        overflow: hidden !important;
                    }
                    .slide-container {
                        width: 1280px !important;
                        height: 720px !important;
                        max-width: 1280px !important;
                        max-height: 720px !important;
                        overflow: hidden !important;
                    }
                    /* Hide video iframes */
                    iframe[src*="drive.google.com"],
                    iframe[src*="youtube.com"],
                    iframe[src*="youtu.be"] {
                        display: none !important;
                        visibility: hidden !important;
                    }
                    /* Show video thumbnails */
                    .video-print-placeholder {
                        display: flex !important;
                    }
                    .video-print-placeholder img {
                        width: 100% !important;
                        height: 100% !important;
                        object-fit: cover !important;
                        display: block !important;
                    }
                    /* Ensure no overflow */
                    * {
                        box-sizing: border-box;
                    }
                }
            `;
            iframeDoc.head.appendChild(printStyle);
        } catch (e) {
            console.log('Could not inject print styles:', e);
        }
    }
    
    // Initialize slide selector
    // Handle Google Drive images - create fallback placeholders
    function handleGoogleDriveImages(iframe) {
        try {
            const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
            if (!iframeDoc) return;

            // Find all Google Drive images
            const gdImages = iframeDoc.querySelectorAll('img[src*="drive.google.com"]');
            gdImages.forEach(img => {
                if (img.getAttribute('data-handled') === 'true') return;

                // Mark as handled
                img.setAttribute('data-handled', 'true');

                // Store original styling
                const parent = img.parentElement;
                const parentRect = parent ? parent.getBoundingClientRect() : null;

                // Ensure proper sizing
                img.style.maxWidth = '100%';
                img.style.maxHeight = parentRect ? `${parentRect.height}px` : '200px';
                img.style.objectFit = 'contain';
                img.style.display = 'block';

                // Add error handler for print
                img.onerror = function() {
                    this.style.display = 'none';
                    // Show fallback if exists
                    const fallback = this.nextElementSibling;
                    if (fallback) {
                        fallback.style.display = 'flex';
                    }
                };
            });
        } catch (e) {
            console.log('Could not handle Google Drive images:', e);
        }
    }

    function initSlideSelector() {
        const selector = document.getElementById('slideSelector');
        slideTitles.forEach((title, index) => {
            const checkbox = document.createElement('div');
            checkbox.className = 'slide-checkbox';
            checkbox.innerHTML = `
                <input type="checkbox" id="slide-${index + 1}-check" checked>
                <label for="slide-${index + 1}-check">${index + 1}. ${title}</label>
            `;
            selector.appendChild(checkbox);
        });
    }
    
    // Navigation functions
    function showSlide(index) {
        if (index < 0 || index >= totalSlides) return;
        
        document.querySelectorAll('.slide-wrapper').forEach((slide, i) => {
            if (i === index) {
                slide.classList.add('active');
            } else {
                slide.classList.remove('active');
            }
        });
        
        currentSlideIndex = index;
        updateNavigation();
        
        // Fix project names for the new slide
        const iframe = document.getElementById(`iframe-${index + 1}`);
        if (iframe) {
            setTimeout(() => {
                fixProjectNames(iframe);
                initializeCharts(iframe);
                injectPrintStyles(iframe);
            }, 300);
        }
    }
    
    function nextSlide() {
        if (currentSlideIndex < totalSlides - 1) {
            showSlide(currentSlideIndex + 1);
        }
    }
    
    function previousSlide() {
        if (currentSlideIndex > 0) {
            showSlide(currentSlideIndex - 1);
        }
    }
    
    function updateNavigation() {
        document.getElementById('currentSlide').textContent = currentSlideIndex + 1;
        document.getElementById('prevBtn').disabled = currentSlideIndex === 0;
        document.getElementById('nextBtn').disabled = currentSlideIndex === totalSlides - 1;
    }
    
    // Fullscreen
    function toggleFullscreen() {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen();
        } else {
            document.exitFullscreen();
        }
    }
    
    // Keyboard navigation
    document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ') {
            e.preventDefault();
            nextSlide();
        } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
            e.preventDefault();
            previousSlide();
        } else if (e.key === 'f' || e.key === 'F') {
            e.preventDefault();
            toggleFullscreen();
        } else if (e.key === 'p' || e.key === 'P') {
            // Press 'P' to toggle PDF export panel
            if (e.ctrlKey || e.metaKey) {
                e.preventDefault();
                togglePDFControls();
            }
        }
    });
    
    // PDF Export functions
    function selectAllSlides() {
        document.querySelectorAll('#slideSelector input[type="checkbox"]').forEach(cb => {
            cb.checked = true;
        });
    }
    
    function deselectAllSlides() {
        document.querySelectorAll('#slideSelector input[type="checkbox"]').forEach(cb => {
            cb.checked = false;
        });
    }
    
    function getSelectedSlides() {
        const selected = [];
        document.querySelectorAll('#slideSelector input[type="checkbox"]').forEach((cb, index) => {
            if (cb.checked) {
                selected.push(index);
            }
        });
        return selected;
    }
    
    function exportSelectedSlides() {
        const selected = getSelectedSlides();
        if (selected.length === 0) {
            alert('Please select at least one slide to export.');
            return;
        }
        exportSlides(selected);
    }
    
    function exportAllSlides() {
        const all = Array.from({length: totalSlides}, (_, i) => i);
        exportSlides(all);
    }
    
    async function exportSlides(slideIndices) {
        if (slideIndices.length === 0) {
            alert('Please select at least one slide to export.');
            return;
        }

        // Show loading indicator
        const loadingOverlay = document.createElement('div');
        loadingOverlay.id = 'pdf-loading';
        loadingOverlay.style.cssText = `
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(15, 23, 42, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10000;
        `;
        loadingOverlay.innerHTML = `
            <div style="color: #22d3ee; font-size: 24px; margin-bottom: 20px;">
                <i class="fa-solid fa-spinner fa-spin"></i>
            </div>
            <div style="color: white; font-size: 18px; font-weight: 600;">Preparing PDF...</div>
            <div id="pdf-progress" style="color: #94a3b8; font-size: 14px; margin-top: 10px;">Processing slides...</div>
        `;
        document.body.appendChild(loadingOverlay);

        const updateProgress = (text) => {
            const progressEl = document.getElementById('pdf-progress');
            if (progressEl) progressEl.textContent = text;
        };

        try {
            // Prepare all slides for printing
            for (let i = 0; i < slideIndices.length; i++) {
                const slideIndex = slideIndices[i];
                updateProgress(`Preparing slide ${i + 1} of ${slideIndices.length}...`);

                const slideWrapper = document.getElementById(`slide-${slideIndex + 1}`);
                const iframe = slideWrapper?.querySelector('iframe');

                if (!iframe) continue;

                try {
                    // Prepare slide for print
                    await prepareSlideForPrint(iframe);
                } catch (slideErr) {
                    console.log(`Error preparing slide ${slideIndex + 1}:`, slideErr);
                }
            }

            // Wait a moment for all changes to render
            await new Promise(resolve => setTimeout(resolve, 300));

            // Hide non-selected slides
            const allSlides = document.querySelectorAll('.slide-wrapper');
            allSlides.forEach((slide, index) => {
                if (!slideIndices.includes(index)) {
                    slide.setAttribute('data-hidden-for-print', 'true');
                    slide.style.display = 'none';
                } else {
                    slide.style.display = 'block';
                    slide.classList.add('active');
                }
            });

            // Remove loading overlay before print
            const overlay = document.getElementById('pdf-loading');
            if (overlay) overlay.remove();

            // Use browser print dialog
            updateProgress('Opening print dialog...');

            // Show instructions
            alert('PDF Export Instructions:\n\n1. In the print dialog, select "Save as PDF" as the destination\n2. Set paper size to "Custom" with 1280x720 px (or use Landscape A4)\n3. Enable "Background graphics" option\n4. Click Save\n\nClick OK to continue.');

            // Trigger print
            window.print();

            // Restore slides after printing
            setTimeout(() => {
                allSlides.forEach((slide, index) => {
                    if (slide.getAttribute('data-hidden-for-print') === 'true') {
                        slide.removeAttribute('data-hidden-for-print');
                        if (index === currentSlideIndex) {
                            slide.style.display = 'block';
                            slide.classList.add('active');
                        } else {
                            slide.style.display = 'none';
                            slide.classList.remove('active');
                        }
                    }
                });

                // Restore slides from print mode
                slideIndices.forEach(slideIndex => {
                    const slideWrapper = document.getElementById(`slide-${slideIndex + 1}`);
                    const iframe = slideWrapper?.querySelector('iframe');
                    if (iframe) {
                        restoreSlideFromPrint(iframe);
                    }
                });
            }, 1000);

        } catch (err) {
            console.error('PDF export error:', err);
            alert('Error preparing PDF. Please try using browser print (Ctrl+P) directly.');

            // Remove loading overlay
            const overlay = document.getElementById('pdf-loading');
            if (overlay) overlay.remove();
        }
    }

    // Prepare slide for print - convert dynamic elements to static
    async function prepareSlideForPrint(iframe) {
        try {
            const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
            const iframeWin = iframe.contentWindow;
            if (!iframeDoc || !iframeWin) return;

            // Show SVG gauge fallbacks
            const svgGauges = iframeDoc.querySelectorAll('.svg-gauge');
            svgGauges.forEach(svg => {
                svg.style.display = 'block';
            });

            // Hide canvas elements (ECharts)
            const canvases = iframeDoc.querySelectorAll('canvas');
            canvases.forEach(canvas => {
                canvas.style.display = 'none';
            });

            // Handle video iframes - show fallback placeholders
            const videoIframes = iframeDoc.querySelectorAll('iframe[src*="drive.google.com"], iframe[src*="youtube.com"]');
            videoIframes.forEach(videoIframe => {
                videoIframe.style.display = 'none';

                // Show existing fallback if present
                const parent = videoIframe.parentElement;
                if (parent) {
                    const fallback = parent.querySelector('.video-fallback');
                    if (fallback) {
                        fallback.style.display = 'flex';
                    }
                }
            });

            // Handle Google Drive images - show fallback
            const gdImages = iframeDoc.querySelectorAll('img[src*="drive.google.com"]');
            gdImages.forEach(img => {
                img.style.display = 'none';

                // Show existing fallback if present
                const parent = img.parentElement;
                if (parent) {
                    const fallback = parent.querySelector('.image-fallback');
                    if (fallback) {
                        fallback.style.display = 'flex';
                    }
                }
            });

        } catch (e) {
            console.log('Error preparing slide for print:', e);
        }
    }

    // Restore slide after print
    function restoreSlideFromPrint(iframe) {
        try {
            const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
            if (!iframeDoc) return;

            // Hide SVG gauge fallbacks
            const svgGauges = iframeDoc.querySelectorAll('.svg-gauge');
            svgGauges.forEach(svg => {
                svg.style.display = 'none';
            });

            // Show canvas elements
            const canvases = iframeDoc.querySelectorAll('canvas');
            canvases.forEach(canvas => {
                canvas.style.display = '';
            });

            // Restore video iframes
            const videoIframes = iframeDoc.querySelectorAll('iframe[src*="drive.google.com"], iframe[src*="youtube.com"]');
            videoIframes.forEach(videoIframe => {
                videoIframe.style.display = '';

                // Hide fallback
                const parent = videoIframe.parentElement;
                if (parent) {
                    const fallback = parent.querySelector('.video-fallback');
                    if (fallback) {
                        fallback.style.display = 'none';
                    }
                }
            });

            // Restore Google Drive images
            const gdImages = iframeDoc.querySelectorAll('img[src*="drive.google.com"]');
            gdImages.forEach(img => {
                img.style.display = '';

                // Hide fallback
                const parent = img.parentElement;
                if (parent) {
                    const fallback = parent.querySelector('.image-fallback');
                    if (fallback) {
                        fallback.style.display = 'none';
                    }
                }
            });

        } catch (e) {
            console.log('Error restoring slide from print:', e);
        }
    }

    // Toggle PDF controls
    function togglePDFControls() {
        const pdfControls = document.getElementById('pdfControls');
        
        if (pdfControls.classList.contains('visible')) {
            pdfControls.classList.remove('visible');
        } else {
            pdfControls.classList.add('visible');
        }
    }
    
    // Initialize on load
    window.addEventListener('load', () => {
        initSlides();
    });
</script>
</body>
</html>
