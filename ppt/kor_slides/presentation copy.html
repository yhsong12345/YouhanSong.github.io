<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>AI & Robotics Researcher Portfolio - Presentation</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;800;900&amp;family=Noto+Sans+KR:wght@300;400;500;700;900&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<style>
    body {
        margin: 0;
        padding: 0;
        font-family: 'Noto Sans KR', sans-serif;
        background-color: #0f172a;
        overflow: hidden;
    }
    
    .presentation-wrapper {
        width: 100vw;
        height: 100vh;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #0f172a;
    }
    
    .slide-wrapper {
        width: 1280px;
        height: 720px;
        position: relative;
        margin: auto;
        display: none;
    }
    
    .slide-wrapper.active {
        display: block;
    }
    
    .slide-wrapper iframe {
        width: 100%;
        height: 100%;
        border: none;
        background: #0f172a;
    }
    
    /* Navigation Controls */
    .nav-controls {
        position: fixed;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 1000;
        display: flex;
        gap: 15px;
        align-items: center;
        background: rgba(15, 23, 42, 0.9);
        backdrop-filter: blur(10px);
        padding: 12px 24px;
        border-radius: 50px;
        border: 1px solid rgba(56, 189, 248, 0.3);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }
    
    .nav-btn {
        background: rgba(34, 211, 238, 0.1);
        border: 1px solid rgba(34, 211, 238, 0.3);
        color: #22d3ee;
        padding: 10px 20px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 14px;
        font-weight: 600;
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        gap: 8px;
    }
    
    .nav-btn:hover {
        background: rgba(34, 211, 238, 0.2);
        border-color: rgba(34, 211, 238, 0.5);
        transform: translateY(-2px);
    }
    
    .nav-btn:disabled {
        opacity: 0.3;
        cursor: not-allowed;
    }
    
    .slide-counter {
        color: #94a3b8;
        font-size: 14px;
        padding: 0 15px;
        font-weight: 500;
    }
    
    /* PDF Export Controls - Hidden by default */
    .pdf-controls {
        position: fixed;
        top: 30px;
        right: 30px;
        z-index: 1000;
        background: rgba(15, 23, 42, 0.9);
        backdrop-filter: blur(10px);
        padding: 20px;
        border-radius: 16px;
        border: 1px solid rgba(56, 189, 248, 0.3);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        min-width: 300px;
        max-height: 80vh;
        overflow-y: auto;
        display: none; /* Hidden by default */
    }
    
    .pdf-controls.visible {
        display: block;
    }
    
    
    .pdf-controls h3 {
        color: #22d3ee;
        font-size: 16px;
        font-weight: 700;
        margin-bottom: 15px;
        display: flex;
        align-items: center;
        gap: 8px;
    }
    
    .slide-selector {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-bottom: 15px;
        max-height: 400px;
        overflow-y: auto;
    }
    
    .slide-checkbox {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px;
        border-radius: 6px;
        cursor: pointer;
        transition: background 0.2s;
    }
    
    .slide-checkbox:hover {
        background: rgba(34, 211, 238, 0.1);
    }
    
    .slide-checkbox input[type="checkbox"] {
        width: 18px;
        height: 18px;
        cursor: pointer;
        accent-color: #22d3ee;
    }
    
    .slide-checkbox label {
        color: #e2e8f0;
        font-size: 13px;
        cursor: pointer;
        flex: 1;
    }
    
    .pdf-actions {
        display: flex;
        flex-direction: column;
        gap: 10px;
    }
    
    .pdf-btn {
        background: linear-gradient(135deg, #06b6d4, #3b82f6);
        border: none;
        color: white;
        padding: 12px 20px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 14px;
        font-weight: 600;
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
    }
    
    .pdf-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 20px rgba(6, 182, 212, 0.3);
    }
    
    .select-all-btns {
        display: flex;
        gap: 8px;
        margin-bottom: 10px;
    }
    
    .select-btn {
        flex: 1;
        background: rgba(34, 211, 238, 0.1);
        border: 1px solid rgba(34, 211, 238, 0.3);
        color: #22d3ee;
        padding: 8px 12px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 12px;
        font-weight: 500;
        transition: all 0.2s;
    }
    
    .select-btn:hover {
        background: rgba(34, 211, 238, 0.2);
    }
    
    /* Print Styles */
    @media print {
        body {
            margin: 0;
            padding: 0;
            background: #0f172a;
        }
        
        .nav-controls,
        .pdf-controls {
            display: none !important;
        }
        
        .presentation-wrapper {
            width: 100%;
            height: auto;
        }
        
        .slide-wrapper {
            width: 1280px;
            height: 720px;
            display: block !important;
            page-break-after: always;
            page-break-inside: avoid;
            margin: 0;
            padding: 0;
        }
        
        .slide-wrapper:last-child {
            page-break-after: auto;
        }
        
        .slide-wrapper iframe {
            width: 1280px;
            height: 720px;
        }
        
        @page {
            size: 1280px 720px;
            margin: 0;
        }
        
        * {
            -webkit-print-color-adjust: exact !important;
            print-color-adjust: exact !important;
            color-adjust: exact !important;
        }
    }
    
    /* Fix for project names alignment - will be applied via CSS injection */
    .project-name-fix {
        text-align: left !important;
        justify-content: flex-start !important;
    }
</style>
</head>
<body>
<div class="presentation-wrapper">
    <!-- PDF Export Controls (Hidden by default) -->
    <div class="pdf-controls" id="pdfControls">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <h3 style="margin: 0;"><i class="fa-solid fa-file-pdf"></i> PDF Export</h3>
            <button onclick="togglePDFControls()" style="background: transparent; border: none; color: #94a3b8; cursor: pointer; font-size: 20px; padding: 0; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center;">
                <i class="fa-solid fa-times"></i>
            </button>
        </div>
        <div class="select-all-btns">
            <button class="select-btn" onclick="selectAllSlides()">Select All</button>
            <button class="select-btn" onclick="deselectAllSlides()">Deselect All</button>
        </div>
        <div class="slide-selector" id="slideSelector"></div>
        <div class="pdf-actions">
            <button class="pdf-btn" onclick="exportSelectedSlides()">
                <i class="fa-solid fa-download"></i> Export Selected to PDF
            </button>
            <button class="pdf-btn" onclick="exportAllSlides()" style="background: linear-gradient(135deg, #8b5cf6, #ec4899);">
                <i class="fa-solid fa-file-export"></i> Export All Slides
            </button>
        </div>
    </div>
    
    <!-- Navigation Controls -->
    <div class="nav-controls">
        <button class="nav-btn" onclick="previousSlide()" id="prevBtn">
            <i class="fa-solid fa-chevron-left"></i> Previous
        </button>
        <div class="slide-counter">
            <span id="currentSlide">1</span> / <span id="totalSlides">14</span>
        </div>
        <button class="nav-btn" onclick="nextSlide()" id="nextBtn">
            Next <i class="fa-solid fa-chevron-right"></i>
        </button>
        <button class="nav-btn" onclick="toggleFullscreen()">
            <i class="fa-solid fa-expand"></i> Fullscreen
        </button>
        <button class="nav-btn" onclick="togglePDFControls()" id="pdfToggleBtn">
            <i class="fa-solid fa-file-pdf"></i> PDF Export
        </button>
    </div>
    
    <!-- Slide Containers -->
    <div id="slideContainer"></div>
</div>

<script>
    const totalSlides = 14;
    let currentSlideIndex = 0;
    const slideFiles = [
        'slide01.html',
        'slide02.html',
        'slide03.html',
        'slide04.html',
        'slide05.html',
        'slide06.html',
        'slide07.html',
        'slide08.html',
        'slide09.html',
        'slide10.html',
        'slide11.html',
        'slide12.html',
        'slide13.html',
        'slide14.html'
    ];
    
    const slideTitles = [
        'Title - AI & Robotics Researcher',
        'Researcher Profile',
        'Education & Career Timeline',
        'Core Competencies & Skills',
        'Korean LLM Development',
        'SEEU Track - Vehicle Detection',
        'Face Recognition System',
        'SEEU ID - ID Card OCR',
        'Tanzania Smart Gate',
        'Gumi Metaverse - Safety Detection',
        'AVA Project - Autonomous Driving',
        'Robotic Arm Object Relocator',
        'Key Achievements Summary',
        'Thank You'
    ];
    
    // Initialize slides
    function initSlides() {
        const container = document.getElementById('slideContainer');
        slideFiles.forEach((file, index) => {
            const wrapper = document.createElement('div');
            wrapper.className = 'slide-wrapper';
            wrapper.id = `slide-${index + 1}`;
            if (index === 0) wrapper.classList.add('active');
            
            const iframe = document.createElement('iframe');
            iframe.src = file;
            iframe.id = `iframe-${index + 1}`;
            iframe.onload = function() {
                // Fix project name alignment after iframe loads
                setTimeout(() => {
                    fixProjectNames(iframe);
                    initializeCharts(iframe);
                }, 500);
                
                // Also check when slide becomes active
                const observer = new MutationObserver(() => {
                    if (wrapper.classList.contains('active')) {
                        setTimeout(() => {
                            fixProjectNames(iframe);
                            initializeCharts(iframe);
                        }, 300);
                    }
                });
                observer.observe(wrapper, { attributes: true, attributeFilter: ['class'] });
            };
            
            wrapper.appendChild(iframe);
            container.appendChild(wrapper);
        });
        
        // Initialize slide selector
        initSlideSelector();
        updateNavigation();
    }
    
    // Fix project names alignment
    function fixProjectNames(iframe) {
        try {
            const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
            if (!iframeDoc) return;
            
            // Inject CSS to fix project name alignment
            const style = iframeDoc.createElement('style');
            style.textContent = `
                /* Fix project headers - ensure left alignment */
                .relative.z-10.px-8 > div:first-child,
                .relative.z-10.px-10 > div:first-child,
                .relative.z-10.px-12 > div:first-child {
                    text-align: left !important;
                    justify-content: flex-start !important;
                }
                
                /* Fix h1 project titles */
                h1.font-\\['Montserrat'\\],
                h1.text-3xl,
                h1.text-4xl,
                h1.text-2xl {
                    text-align: left !important;
                }
                
                /* Fix header containers */
                .flex.justify-between.items-start > div:first-child {
                    text-align: left !important;
                    align-items: flex-start !important;
                }
                
                /* Ensure project name sections are left-aligned */
                .relative.z-10.px-8 .flex.items-center.space-x-3,
                .relative.z-10.px-10 .flex.items-center.space-x-3,
                .relative.z-10.px-12 .flex.items-center.space-x-3 {
                    justify-content: flex-start !important;
                }
            `;
            iframeDoc.head.appendChild(style);
            
            // Also fix specific elements
            const headers = iframeDoc.querySelectorAll('h1');
            headers.forEach(header => {
                const text = header.textContent || '';
                if (text.includes('LLM') || text.includes('SEEU') || text.includes('Face') || 
                    text.includes('AVA') || text.includes('Robotic') || text.includes('Tanzania') || 
                    text.includes('Gumi') || text.includes('Project') || text.includes('한국어') ||
                    text.includes('ID') || text.includes('Track')) {
                    header.style.textAlign = 'left';
                    const parent = header.closest('.flex');
                    if (parent) {
                        parent.style.justifyContent = 'flex-start';
                    }
                }
            });
        } catch (e) {
            console.log('Could not access iframe content:', e);
        }
    }
    
    // Initialize charts in iframe
    function initializeCharts(iframe) {
        try {
            const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
            if (!iframeDoc) return;
            
            // Wait for ECharts to be available and ensure charts are visible
            const checkCharts = setInterval(() => {
                if (iframe.contentWindow.echarts && iframeDoc.querySelectorAll('[id*="chart"], [id*="Chart"]').length > 0) {
                    // Trigger resize to ensure charts render
                    iframe.contentWindow.dispatchEvent(new Event('resize'));
                    
                    // Get all chart containers and ensure they're visible
                    const chartContainers = iframeDoc.querySelectorAll('[id*="chart"], [id*="Chart"]');
                    chartContainers.forEach(container => {
                        container.style.visibility = 'visible';
                        container.style.opacity = '1';
                        container.style.display = 'block';
                    });
                    
                    clearInterval(checkCharts);
                }
            }, 200);
            
            // Stop checking after 5 seconds
            setTimeout(() => clearInterval(checkCharts), 5000);
        } catch (e) {
            console.log('Could not initialize charts:', e);
        }
    }
    
    // Initialize slide selector
    function initSlideSelector() {
        const selector = document.getElementById('slideSelector');
        slideTitles.forEach((title, index) => {
            const checkbox = document.createElement('div');
            checkbox.className = 'slide-checkbox';
            checkbox.innerHTML = `
                <input type="checkbox" id="slide-${index + 1}-check" checked>
                <label for="slide-${index + 1}-check">${index + 1}. ${title}</label>
            `;
            selector.appendChild(checkbox);
        });
    }
    
    // Navigation functions
    function showSlide(index) {
        if (index < 0 || index >= totalSlides) return;
        
        document.querySelectorAll('.slide-wrapper').forEach((slide, i) => {
            if (i === index) {
                slide.classList.add('active');
            } else {
                slide.classList.remove('active');
            }
        });
        
        currentSlideIndex = index;
        updateNavigation();
        
        // Fix project names for the new slide
        const iframe = document.getElementById(`iframe-${index + 1}`);
        if (iframe) {
            setTimeout(() => {
                fixProjectNames(iframe);
                initializeCharts(iframe);
            }, 300);
        }
    }
    
    function nextSlide() {
        if (currentSlideIndex < totalSlides - 1) {
            showSlide(currentSlideIndex + 1);
        }
    }
    
    function previousSlide() {
        if (currentSlideIndex > 0) {
            showSlide(currentSlideIndex - 1);
        }
    }
    
    function updateNavigation() {
        document.getElementById('currentSlide').textContent = currentSlideIndex + 1;
        document.getElementById('prevBtn').disabled = currentSlideIndex === 0;
        document.getElementById('nextBtn').disabled = currentSlideIndex === totalSlides - 1;
    }
    
    // Fullscreen
    function toggleFullscreen() {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen();
        } else {
            document.exitFullscreen();
        }
    }
    
    // Keyboard navigation
    document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ') {
            e.preventDefault();
            nextSlide();
        } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
            e.preventDefault();
            previousSlide();
        } else if (e.key === 'f' || e.key === 'F') {
            e.preventDefault();
            toggleFullscreen();
        } else if (e.key === 'p' || e.key === 'P') {
            // Press 'P' to toggle PDF export panel
            if (e.ctrlKey || e.metaKey) {
                e.preventDefault();
                togglePDFControls();
            }
        }
    });
    
    // PDF Export functions
    function selectAllSlides() {
        document.querySelectorAll('#slideSelector input[type="checkbox"]').forEach(cb => {
            cb.checked = true;
        });
    }
    
    function deselectAllSlides() {
        document.querySelectorAll('#slideSelector input[type="checkbox"]').forEach(cb => {
            cb.checked = false;
        });
    }
    
    function getSelectedSlides() {
        const selected = [];
        document.querySelectorAll('#slideSelector input[type="checkbox"]').forEach((cb, index) => {
            if (cb.checked) {
                selected.push(index);
            }
        });
        return selected;
    }
    
    function exportSelectedSlides() {
        const selected = getSelectedSlides();
        if (selected.length === 0) {
            alert('Please select at least one slide to export.');
            return;
        }
        exportSlides(selected);
    }
    
    function exportAllSlides() {
        const all = Array.from({length: totalSlides}, (_, i) => i);
        exportSlides(all);
    }
    
    function exportSlides(slideIndices) {
        if (slideIndices.length === 0) {
            alert('Please select at least one slide to export.');
            return;
        }
        
        // Hide controls
        document.querySelector('.nav-controls').style.display = 'none';
        document.querySelector('.pdf-controls').style.display = 'none';
        
        // Show only selected slides
        document.querySelectorAll('.slide-wrapper').forEach((slide, index) => {
            if (slideIndices.includes(index)) {
                slide.style.display = 'block';
                slide.style.pageBreakAfter = 'always';
                
                // Ensure iframe content is ready
                const iframe = slide.querySelector('iframe');
                if (iframe) {
                    try {
                        const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
                        if (iframeDoc) {
                            // Ensure charts are visible
                            const charts = iframeDoc.querySelectorAll('[id*="chart"], [id*="Chart"]');
                            charts.forEach(chart => {
                                chart.style.visibility = 'visible';
                                chart.style.opacity = '1';
                            });
                            
                            // Trigger chart resize
                            if (iframe.contentWindow.echarts) {
                                iframe.contentWindow.dispatchEvent(new Event('resize'));
                            }
                        }
                    } catch (e) {
                        console.log('Could not access iframe for export:', e);
                    }
                }
            } else {
                slide.style.display = 'none';
            }
        });
        
        // Wait for iframes to fully load and charts to render
        setTimeout(() => {
            // Add print-specific styles
            const printStyle = document.createElement('style');
            printStyle.textContent = `
                @media print {
                    @page {
                        size: 1280px 720px;
                        margin: 0;
                    }
                    body {
                        margin: 0;
                        padding: 0;
                        background: #0f172a;
                    }
                    .slide-wrapper {
                        width: 1280px !important;
                        height: 720px !important;
                        page-break-after: always;
                        page-break-inside: avoid;
                        margin: 0;
                        padding: 0;
                    }
                    .slide-wrapper:last-child {
                        page-break-after: auto;
                    }
                    .slide-wrapper iframe {
                        width: 1280px !important;
                        height: 720px !important;
                    }
                    * {
                        -webkit-print-color-adjust: exact !important;
                        print-color-adjust: exact !important;
                        color-adjust: exact !important;
                    }
                    canvas {
                        max-width: 100% !important;
                        height: auto !important;
                    }
                }
            `;
            document.head.appendChild(printStyle);
            
            // Trigger print
            window.print();
            
            // Restore controls after print dialog closes
            setTimeout(() => {
                document.head.removeChild(printStyle);
                document.querySelector('.nav-controls').style.display = 'flex';
                const pdfControls = document.querySelector('.pdf-controls');
                if (pdfControls && pdfControls.classList.contains('visible')) {
                    pdfControls.style.display = 'block';
                }
                showSlide(currentSlideIndex);
            }, 1000);
        }, 1000);
    }
    
    // Toggle PDF controls
    function togglePDFControls() {
        const pdfControls = document.getElementById('pdfControls');
        
        if (pdfControls.classList.contains('visible')) {
            pdfControls.classList.remove('visible');
        } else {
            pdfControls.classList.add('visible');
        }
    }
    
    // Initialize on load
    window.addEventListener('load', () => {
        initSlides();
    });
</script>
</body>
</html>
